[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-config-sync"
version = "0.1.0"
description = "Enterprise automation for syncing vendor configuration from S3 to GitHub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.35.99",
  "pyyaml==6.0.2",
  "deepdiff==8.4.2",
  "pydantic==2.11.4"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
