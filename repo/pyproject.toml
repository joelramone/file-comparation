[project]
name = "vendor-config-sync-automation"
version = "1.0.0"
description = "Automation to sync vendor config files from AWS S3 into an external GitHub application repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.35.99",
  "pyyaml==6.0.2",
  "deepdiff==8.0.1",
  "requests==2.32.3",
  "GitPython==3.1.43",
  "pydantic==2.9.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
