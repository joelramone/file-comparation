[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-config-sync-automation"
version = "0.1.0"
description = "Automation for syncing vendor S3 configuration into external GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.0",
  "pyyaml>=6.0.0",
  "deepdiff>=8.0.0",
  "requests>=2.32.0",
  "GitPython>=3.1.43",
  "pydantic>=2.7.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
